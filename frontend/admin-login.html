<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login | CuisineHub</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.admin-login-wrap{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:45px 0}
.admin-badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:rgba(255,122,69,.15);color:#ff9b73;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:1.5px}
.admin-link-back{display:inline-block;margin-top:14px;color:var(--muted);font-size:13px}.admin-link-back:hover{color:white}
.admin-login-actions{margin-top:20px}
</style>
</head>
<body>
<div id="nav"></div>
<main class="container admin-login-wrap">
<div class="formbox">
<span class="admin-badge">Admin Panel</span>
<h1>Administrator Login</h1>
<p class="muted">Sign in with the administrator email and password to open the live dashboard.</p>
<div id="adminMsg"></div>
<form id="adminLoginForm">
<div class="field"><label>Email</label><input class="input" type="email" id="adminEmail" autocomplete="username" required></div>
<div class="field"><label>Password</label><input class="input" type="password" id="adminPassword" autocomplete="current-password" required></div>
<div class="admin-login-actions"><button class="btn" style="width:100%" type="submit">Login as Admin</button></div>
</form>
<a class="admin-link-back" href="/login.html">← Back to normal login</a>
</div>
</main>
<script>
const API='/api';
async function api(path,opts={}){const r=await fetch(API+path,{headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'Request failed');return d}
document.getElementById('adminLoginForm').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('adminMsg');msg.className='';msg.textContent='';try{await api('/admin/login',{method:'POST',body:JSON.stringify({email:document.getElementById('adminEmail').value,password:document.getElementById('adminPassword').value})});location.href='/admin.html'}catch(err){msg.className='alert';msg.textContent=err.message}});
(async()=>{try{const d=await api('/admin/me');if(d.admin)location.href='/admin.html'}catch(e){}})();
</script>
</body>
</html>
